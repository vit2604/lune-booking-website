name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies used by shared tests
        working-directory: server
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Dependency audit
        shell: bash
        run: |
          set +e
          audit_output=$(npm audit --audit-level=high 2>&1)
          audit_status=$?
          printf '%s\n' "$audit_output"
          if [ "$audit_status" -ne 0 ]; then
            if printf '%s\n' "$audit_output" | grep -Eqi 'audit endpoint returned an error|network timeout|ECONNRESET|ETIMEDOUT'; then
              echo '::warning::npm audit registry is temporarily unavailable; OSV/package updates are handled separately.'
            else
              exit "$audit_status"
            fi
          fi

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend schema check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://lune_user:lune_password@localhost:5432/lune_booking_db?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Backend dependency audit
        working-directory: server
        shell: bash
        run: |
          set +e
          audit_output=$(npm audit --audit-level=high 2>&1)
          audit_status=$?
          printf '%s\n' "$audit_output"
          if [ "$audit_status" -ne 0 ]; then
            if printf '%s\n' "$audit_output" | grep -Eqi 'audit endpoint returned an error|network timeout|ECONNRESET|ETIMEDOUT'; then
              echo '::warning::npm audit registry is temporarily unavailable; OSV/package updates are handled separately.'
            else
              exit "$audit_status"
            fi
          fi

      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate
